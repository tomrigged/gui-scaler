name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Zoek de juiste Yarn-mappings voor 1.21.11
        run: |
          YARN=$(curl -fsSL https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['version'])")
          echo "Yarn: $YARN"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: fracgui-mod
          path: build/libs/*.jar
